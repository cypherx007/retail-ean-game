<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>Retail Training - CypherX</title>

<style>

/* =========================
   BASE GLASS THEME
   ========================= */

:root{
  --glass: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.18);
  --primary:#4f8cff;
  --secondary:#7c5cff;
  --success:#30d158;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;

  background:
    radial-gradient(circle at 20% 20%, #1a2a55 0%, transparent 40%),
    radial-gradient(circle at 80% 80%, #301b4a 0%, transparent 40%),
    linear-gradient(160deg,#0b0f19,#05070c);

  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;

  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}


/* =========================
   MAIN FRAME
   ========================= */

.mobile-frame{
  width:100%;
  height:100%;
  max-width:480px;

  backdrop-filter: blur(45px) saturate(160%);
  background:rgba(15,20,35,0.75);

  border-radius:40px;
  border:1px solid var(--border);

  box-shadow:0 30px 80px rgba(0,0,0,0.8);

  display:flex;
  flex-direction:column;
  overflow:hidden;
}


/* =========================
   RESPONSIVE MAGIC
   ========================= */

/* TABLET */
@media (min-width:600px){
  .mobile-frame{
    max-width:680px;
    height:92vh;
  }
}

/* DESKTOP */
@media (min-width:1024px){
  .mobile-frame{
    max-width:900px;
    height:85vh;
    border-radius:28px;
  }
}


/* =========================
   DEVICE SPECIFIC TWEAKS
   ========================= */

/* iPhone tighter */
body.ios .btn{ padding:14px; }

/* Android slightly larger tap targets */
body.android .btn{ padding:17px; }

/* Desktop bigger fonts */
body.desktop{
  font-size:17px;
}


/* =========================
   UI STYLES
   ========================= */

.header{
  padding:20px;
  text-align:center;
  font-weight:700;
  background:var(--glass);
  backdrop-filter: blur(30px);
  border-bottom:1px solid var(--border);
}

.screen{
  flex:1;
  overflow:auto;
  padding:20px;
}

.card{
  background:var(--glass);
  backdrop-filter: blur(40px);
  border:1px solid var(--border);
  border-radius:24px;
  padding:20px;
  margin-bottom:16px;
}

.list{
  height:280px;
  overflow:auto;
}

.item{
  padding:12px 16px;
  margin:8px 0;
  border-radius:16px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  font-family:monospace;
}

.highlight{ background:var(--success)!important; }


/* BUTTONS */
.btn{
  width:100%;
  padding:16px;
  border-radius:20px;
  border:none;
  font-weight:600;
  color:white;
  background:linear-gradient(145deg,var(--primary),var(--secondary));
  box-shadow:0 10px 25px rgba(0,0,0,.45);
  transition:.15s;
}

.btn:active{ transform:scale(.96); }

.btn.secondary{
  background:rgba(255,255,255,0.08);
  border:1px solid var(--border);
}


/* INPUT */
input{
  width:100%;
  padding:14px;
  border-radius:18px;
  margin-top:10px;
  background:rgba(255,255,255,0.08);
  border:1px solid var(--border);
  color:white;
}

.footer{
  text-align:center;
  font-size:11px;
  opacity:.6;
  padding:10px;
}

</style>
</head>


<body>

<div class="mobile-frame">

<div class="header">Retail EAN Placement Game</div>


<!-- MENU -->
<div class="screen" id="menu">
<div class="card">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">

<button class="btn" onclick="openDept('Ambient')">🥫 Ambient</button>
<button class="btn" onclick="openDept('Chiller')">🧊 Chiller</button>
<button class="btn" onclick="openDept('Meat')">🥩 Meat</button>
<button class="btn" onclick="openDept('Convenience')">🛒 Convenience</button>
<button class="btn" onclick="openDept('Bread')">🍞 Bread</button>
<button class="btn" onclick="openDept('Freezer')">❄️ Freezer</button>
<button class="btn" onclick="openDept('FruitVeg')">🥦 Fruit & Veg</button>

</div>
</div>
</div>


<!-- GAME -->
<div class="screen" id="game" style="display:none;">

<div class="card">
<h3 id="deptTitle"></h3>
<div class="list" id="eanList"></div>
</div>

<div class="card">
<input id="newEAN" maxlength="7" placeholder="Enter New EAN"/>
<input id="afterEAN" maxlength="7" placeholder="Place After EAN"/>

<div style="display:flex;gap:12px;margin-top:15px;">
<button class="btn" onclick="insertEAN()">➕ Insert / Move</button>
<button class="btn secondary" onclick="back()">⬅ Back</button>
</div>
</div>

</div>

<div class="footer">Created by CypherX</div>

</div>


<script>

/* =========================
   DEVICE DETECTION
   ========================= */

const ua=navigator.userAgent.toLowerCase();

if(/iphone|ipad|ipod/.test(ua)) document.body.classList.add("ios");
else if(/android/.test(ua)) document.body.classList.add("android");
else document.body.classList.add("desktop");


/* =========================
   SAME GAME LOGIC
   ========================= */

const ranges={
Ambient:[5746,5799],
Chiller:[5709,5711],
Freezer:[5812,5813],
Bread:[10002,10004],
Meat:[10005,10006],
FruitVeg:[10011,10012],
Convenience:[20001,20002]
};

let current=[];
let lastMovedEAN=null;

function openDept(d){
document.getElementById('menu').style.display='none';
document.getElementById('game').style.display='block';
document.getElementById('deptTitle').innerText=d;

const [s,e]=ranges[d];
current=[s];
while(current.length<11)
current.push(s+Math.floor(Math.random()*500)+1);
current.push(e);

render();
}

function render(){
const list=document.getElementById('eanList');
list.innerHTML='';
current.forEach(v=>{
const d=document.createElement('div');
d.className='item'+(v===lastMovedEAN?' highlight':'');
d.innerText=v;
list.appendChild(d);
});
}

function insertEAN(){
const eInput=document.getElementById('newEAN').value.trim();
const aInput=document.getElementById('afterEAN').value.trim();
if(!eInput||!aInput) return;
const rule=/^\d{1,7}$/;
if(!rule.test(eInput)||!rule.test(aInput)) return;
const e=+eInput;
const a=+aInput;
if(current.includes(e)) return;
current=current.filter(x=>x!==e);
const i=current.indexOf(a);
if(i>=0){current.splice(i+1,0,e);lastMovedEAN=e;}
render();
document.getElementById('newEAN').value='';
document.getElementById('afterEAN').value='';
}

function back(){
document.getElementById('game').style.display='none';
document.getElementById('menu').style.display='block';
}

</script>
</body>
</html>
