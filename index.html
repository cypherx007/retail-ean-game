<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />

<title>Retail Training - CypherX</title>

<style>

/* ===============================
   GLOBAL
================================ */
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

html,body{
  margin:0;
  height:100%;
}

body{
  height:100dvh;

  font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;

  display:flex;
  justify-content:center;
  align-items:center;

  color:white;

  background:
    radial-gradient(circle at 20% 20%, #1a2a55 0%, transparent 40%),
    radial-gradient(circle at 80% 80%, #301b4a 0%, transparent 40%),
    linear-gradient(160deg,#0b0f19,#05070c);
}


/* ===============================
   APP FRAME
================================ */
.mobile-frame{
  width:100%;
  height:100%;
  max-width:520px;

  display:flex;
  flex-direction:column;

  backdrop-filter:blur(40px);
  background:rgba(15,20,35,0.85);

  border-radius:40px;
  overflow:hidden;
}


/* ===============================
   HEADER
================================ */
.header{
  padding:16px;
  text-align:center;
  font-weight:700;
  background:rgba(255,255,255,.08);
}


/* ===============================
   MENU
================================ */
#menu{
  flex:1;
  padding:16px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.btn{
  border:none;
  border-radius:18px;
  padding:16px;

  font-size:16px;
  font-weight:600;

  color:white;

  background:linear-gradient(145deg,#4f8cff,#7c5cff);
}

.btn.secondary{
  background:rgba(255,255,255,.14);
}


/* ===============================
   GAME LAYOUT
================================ */
#game{
  height:100%;
  padding:14px;

  display:grid;
  grid-template-rows:1fr auto;
  gap:12px;

  padding-bottom:calc(env(safe-area-inset-bottom) + 12px);
}


/* ===============================
   LIST (🔥 GAP ADDED HERE)
================================ */
.list{
  overflow-y:auto;

  background:rgba(255,255,255,.05);
  border-radius:16px;
  padding:12px;

  border:1px solid rgba(255,255,255,.18);

  margin-bottom:46px; /* ✅ ONE EAN HEIGHT GAP */
}

.item{
  padding:12px;
  margin:8px 0;
  border-radius:12px;
  background:rgba(255,255,255,.10);

  font-family:monospace;
  font-size:16px;
}

.highlight{
  background:#30d158!important;
}


/* ===============================
   CONTROLS
================================ */
.controls{
  position:sticky;
  bottom:0;

  background:rgba(20,25,40,.92);
  padding:14px;

  border-radius:18px;
  border:1px solid rgba(255,255,255,.18);

  padding-bottom:
    calc(env(safe-area-inset-bottom) + 18px);
}


input{
  width:100%;
  padding:12px;
  border-radius:14px;

  margin-bottom:10px;

  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);
  color:white;

  font-size:16px;
}


.footer{
  text-align:center;
  font-size:11px;
  opacity:.6;
  padding:6px;
}

</style>
</head>



<body>

<div class="mobile-frame">

<div class="header">Retail EAN Placement Game</div>


<!-- MENU -->
<div id="menu">
<button class="btn" onclick="openDept('Ambient')">🥫 Ambient</button>
<button class="btn" onclick="openDept('Chiller')">🧊 Chiller</button>
<button class="btn" onclick="openDept('Meat')">🥩 Meat</button>
<button class="btn" onclick="openDept('Convenience')">🛒 Convenience</button>
<button class="btn" onclick="openDept('Bread')">🍞 Bread</button>
<button class="btn" onclick="openDept('Freezer')">❄️ Freezer</button>
<button class="btn" onclick="openDept('FruitVeg')">🥦 Fruit & Veg</button>
</div>


<!-- GAME -->
<div id="game" style="display:none">

<div class="list" id="eanList"></div>

<div class="controls">
<input id="newEAN" maxlength="7" placeholder="Enter New EAN"/>
<input id="afterEAN" maxlength="7" placeholder="Place After EAN"/>

<div style="display:flex;gap:8px;">
<button class="btn" onclick="insertEAN()">➕ Insert</button>
<button class="btn secondary" onclick="back()">⬅ Back</button>
</div>
</div>

</div>

<div class="footer">CypherX</div>

</div>



<script>

/* ===============================
   HAPTIC + SOUND
================================ */
let audioCtx;

function tone(freq,dur){
  if(!audioCtx)
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();

  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();

  o.frequency.value=freq;
  g.gain.value=0.15;
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);

  o.connect(g);
  g.connect(audioCtx.destination);

  o.start();
  o.stop(audioCtx.currentTime+dur);
}

function clickSound(){ tone(600,.05); }
function successSound(){ tone(900,.05); setTimeout(()=>tone(1200,.07),60); }
function haptic(ms=8){ if(navigator.vibrate) navigator.vibrate(ms); }

document.addEventListener("click",e=>{
  if(e.target.classList.contains("btn")){
    clickSound();
    haptic(8);
  }
});


/* ===============================
   GAME LOGIC (unchanged)
================================ */
const menuEl=document.getElementById("menu");
const gameEl=document.getElementById("game");
const listEl=document.getElementById("eanList");
const newEAN=document.getElementById("newEAN");
const afterEAN=document.getElementById("afterEAN");

const ranges={
Ambient:[5746,5799],
Chiller:[5709,5711],
Freezer:[5812,5813],
Bread:[10002,10004],
Meat:[10005,10006],
FruitVeg:[10011,10012],
Convenience:[20001,20002]
};

let current=[], lastMovedEAN=null;

function openDept(d){
  menuEl.style.display='none';
  gameEl.style.display='grid';

  const [s,e]=ranges[d];
  current=[s];
  while(current.length<11)
    current.push(s+Math.floor(Math.random()*500)+1);
  current.push(e);

  render();
}

function render(){
  listEl.innerHTML='';
  current.forEach(v=>{
    const el=document.createElement('div');
    el.className='item'+(v===lastMovedEAN?' highlight':'');
    el.textContent=v;
    listEl.appendChild(el);
  });
}

function insertEAN(){
  const e=newEAN.value.trim();
  const a=afterEAN.value.trim();
  if(!/^\d{1,7}$/.test(e)||!/^\d{1,7}$/.test(a))return;
  if(current.includes(+e))return;

  current=current.filter(x=>x!=e);
  const i=current.indexOf(+a);
  if(i>=0){
    current.splice(i+1,0,+e);
    lastMovedEAN=+e;
    successSound();
    haptic(20);
  }

  render();
  newEAN.value='';
  afterEAN.value='';
}

function back(){
  gameEl.style.display='none';
  menuEl.style.display='grid';
}

</script>

</body>
</html>
