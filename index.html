<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<!-- IMPORTANT: viewport fix for iOS -->
<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>Retail Training - CypherX</title>

<style>

/* ======================
   FIX iPHONE HEIGHT BUG
   ====================== */

body{
  margin:0;
  height:100dvh; /* ✅ REAL height (fixes empty space) */

  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;

  display:flex;
  justify-content:center;
  align-items:center;

  color:white;

  background:
    radial-gradient(circle at 20% 20%, #1a2a55 0%, transparent 40%),
    radial-gradient(circle at 80% 80%, #301b4a 0%, transparent 40%),
    linear-gradient(160deg,#0b0f19,#05070c);

  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}


/* ======================
   FRAME
   ====================== */

.mobile-frame{
  width:100%;
  height:100%; /* fill all space */
  max-width:520px;

  backdrop-filter: blur(45px) saturate(160%);
  background:rgba(15,20,35,0.75);

  border-radius:40px;
  border:1px solid rgba(255,255,255,.15);

  display:flex;
  flex-direction:column;
  overflow:hidden;
}


/* ======================
   HEADER
   ====================== */

.header{
  padding:18px;
  text-align:center;
  font-weight:700;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(25px);
}


/* ======================
   SCREENS
   ====================== */

.screen{
  flex:1;
  padding:18px;
  display:flex;
  flex-direction:column;
}


/* ======================
   MENU GRID AUTO-FILL
   ====================== */

.menu-grid{
  flex:1; /* take full screen */
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.menu-grid .btn{
  height:100%; /* fill cell */
}


/* ======================
   CARDS
   ====================== */

.card{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(35px);
  border-radius:22px;
  padding:16px;
  border:1px solid rgba(255,255,255,.15);
  margin-bottom:14px;
}


/* ======================
   BUTTONS
   ====================== */

.btn{
  border:none;
  border-radius:18px;
  font-weight:600;
  color:white;
  background:linear-gradient(145deg,#4f8cff,#7c5cff);
  box-shadow:0 10px 25px rgba(0,0,0,.45);
  font-size:15px;
  transition:.15s;
}

.btn:active{
  transform:scale(.95);
}

.btn.secondary{
  background:rgba(255,255,255,.1);
}


/* ======================
   LIST
   ====================== */

.list{
  flex:1;
  overflow:auto;
}

.item{
  padding:12px;
  margin:8px 0;
  border-radius:14px;
  background:rgba(255,255,255,.06);
  font-family:monospace;
}

.highlight{
  background:#30d158!important;
}


/* INPUT */
input{
  width:100%;
  padding:12px;
  border-radius:14px;
  margin-top:8px;
  background:rgba(255,255,255,.08);
  border:none;
  color:white;
}

.footer{
  text-align:center;
  font-size:11px;
  opacity:.6;
  padding:6px;
}

</style>
</head>

<body>

<div class="mobile-frame">

<div class="header">Retail EAN Placement Game</div>


<!-- MENU -->
<div class="screen" id="menu">
<div class="menu-grid">

<button class="btn" onclick="openDept('Ambient')">🥫 Ambient</button>
<button class="btn" onclick="openDept('Chiller')">🧊 Chiller</button>
<button class="btn" onclick="openDept('Meat')">🥩 Meat</button>
<button class="btn" onclick="openDept('Convenience')">🛒 Convenience</button>
<button class="btn" onclick="openDept('Bread')">🍞 Bread</button>
<button class="btn" onclick="openDept('Freezer')">❄️ Freezer</button>
<button class="btn" onclick="openDept('FruitVeg')">🥦 Fruit & Veg</button>

</div>
</div>


<!-- GAME -->
<div class="screen" id="game" style="display:none;">

<div class="card list" id="eanList"></div>

<div class="card">
<input id="newEAN" maxlength="7" placeholder="Enter New EAN"/>
<input id="afterEAN" maxlength="7" placeholder="Place After EAN"/>

<div style="display:flex;gap:10px;margin-top:10px;">
<button class="btn" onclick="insertEAN()">➕ Insert</button>
<button class="btn secondary" onclick="back()">⬅ Back</button>
</div>
</div>

</div>

<div class="footer">CypherX</div>

</div>


<script>

/* SAME GAME LOGIC */

const ranges={
Ambient:[5746,5799],
Chiller:[5709,5711],
Freezer:[5812,5813],
Bread:[10002,10004],
Meat:[10005,10006],
FruitVeg:[10011,10012],
Convenience:[20001,20002]
};

let current=[];
let lastMovedEAN=null;

function openDept(d){
menu.style.display='none';
game.style.display='flex';

const [s,e]=ranges[d];
current=[s];
while(current.length<11)
current.push(s+Math.floor(Math.random()*500)+1);
current.push(e);

render();
}

function render(){
eanList.innerHTML='';
current.forEach(v=>{
const d=document.createElement('div');
d.className='item'+(v===lastMovedEAN?' highlight':'');
d.innerText=v;
eanList.appendChild(d);
});
}

function insertEAN(){
const e=newEAN.value.trim();
const a=afterEAN.value.trim();
if(!/^\d{1,7}$/.test(e)||!/^\d{1,7}$/.test(a)) return;
if(current.includes(+e)) return;
current=current.filter(x=>x!=e);
const i=current.indexOf(+a);
if(i>=0){current.splice(i+1,0,+e);lastMovedEAN=+e;}
render();
newEAN.value='';
afterEAN.value='';
}

function back(){
game.style.display='none';
menu.style.display='flex';
}

</script>
</body>
</html>
